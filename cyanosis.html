<title>Cyanosis in the Newborn Algorithm</title>

<style>
  :root {
    --green: #2C5440;
    --dark-green: #00391F;
    --mid-green: #005C2E;
    --pale-green: #E8F3EF;
    --cream: #FFFBEA;
    --cream-border: #D8D1A6;
    --red: #D90000;
    --text: #071525;
    --border: #8FA99B;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #EEF3F0;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .toolbar {
    height: 52px;
    background: #0B2F1E;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .toolbar button {
    border: none;
    border-radius: 8px;
    background: white;
    color: #0B2F1E;
    font-weight: 800;
    font-size: 14px;
    padding: 9px 16px;
    cursor: pointer;
  }

  .stage {
    height: calc(100vh - 52px);
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    box-sizing: border-box;
  }

  #poster {
    width: min(calc(100vw - 16px), calc((100vh - 68px) * 1600 / 1067));
    height: auto;
    max-height: calc(100vh - 68px);
    background: white;
    box-shadow: 0 10px 34px rgba(0,0,0,0.2);
    border-radius: 10px;
  }

  @media print {
    .toolbar { display: none; }
    .stage { height: 100vh; padding: 0; }
    #poster {
      width: 100vw;
      max-height: 100vh;
      box-shadow: none;
      border-radius: 0;
    }
  }
</style>
</head>

  <text x="268" y="35" text-anchor="middle" class="header1">ALGORITHM 1</text>
  <text x="268" y="66" text-anchor="middle" class="header2">INITIAL APPROACH TO CYANOSIS</text>

  <text x="800" y="35" text-anchor="middle" class="header1">ALGORITHM 2</text>
  <text x="800" y="66" text-anchor="middle" class="header2">EVALUATION OF CENTRAL CYANOSIS</text>

  <text x="1332" y="35" text-anchor="middle" class="header1">ALGORITHM 3</text>
  <text x="1332" y="66" text-anchor="middle" class="header2">DIFFERENTIATION AND MANAGEMENT</text>
</g>

<!-- Algorithm 1 -->
<g class="font">
  <rect x="20" y="100" width="496" height="42" rx="6" fill="#FFFBEA" stroke="#D8D1A6"/>
  <text x="268" y="128" text-anchor="middle" class="step">STEP 1: IDENTIFY TYPE</text>

  <rect x="20" y="158" width="228" height="260" rx="6" fill="white" stroke="#7EA18E"/>
  <rect x="20" y="158" width="228" height="44" rx="6" fill="#00391F"/>
  <text x="134" y="187" text-anchor="middle" class="boxhead">CENTRAL CYANOSIS</text>
  <text x="134" y="235" text-anchor="middle" class="body">Lips or tongue blue</text>
  <text x="134" y="275" text-anchor="middle" class="body">Oxygen saturation</text>
  <text x="134" y="297" text-anchor="middle" class="body">less than 95%</text>
  <use href="#icon-lips" x="89" y="330" width="90" height="64" color="#00391F"/>

  <rect x="260" y="158" width="256" height="260" rx="6" fill="white" stroke="#7EA18E"/>
  <rect x="260" y="158" width="256" height="44" rx="6" fill="#00391F"/>
  <text x="388" y="187" text-anchor="middle" class="boxhead">PERIPHERAL CYANOSIS</text>
  <text x="388" y="234" text-anchor="middle" class="body">Hands or feet blue</text>
  <text x="388" y="256" text-anchor="middle" class="body">Lips or tongue pink</text>
  <text x="388" y="294" text-anchor="middle" class="body">Oxygen saturation</text>
  <text x="388" y="316" text-anchor="middle" class="body">greater than or</text>
  <text x="388" y="338" text-anchor="middle" class="body">equal to 95%</text>
  <use href="#icon-handfoot" x="328" y="342" width="120" height="70" color="#00391F"/>

  <line x1="260" y1="418" x2="260" y2="450" stroke="#111" stroke-width="2"/>
  <polygon points="260,462 253,450 267,450" fill="#111"/>

  <rect x="258" y="450" width="258" height="40" rx="6" fill="white" stroke="#A8B8B2"/>
  <text x="387" y="476" text-anchor="middle" class="body">Warm baby and observe</text>

  <line x1="260" y1="490" x2="260" y2="522" stroke="#111" stroke-width="2"/>
  <polygon points="260,534 253,522 267,522" fill="#111"/>

  <rect x="20" y="535" width="496" height="42" rx="6" fill="#FFFBEA" stroke="#D8D1A6"/>
  <text x="268" y="563" text-anchor="middle" class="step">STEP 2: IMMEDIATE ASSESSMENT</text>

  <rect x="20" y="590" width="496" height="105" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="72" cy="642" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-lungs" x="49" y="619" width="46" height="46" color="white"/>
  <text x="112" y="623" class="title">STABILISE AIRWAY AND BREATHING</text>
  <text x="112" y="651" class="bodySmall">• Start oxygen support to achieve target oxygen</text>
  <text x="126" y="670" class="bodySmall">saturation 90% to 95%</text>
  <text x="112" y="691" class="bodySmall">• If not responding, consider intubation</text>

  <line x1="268" y1="695" x2="268" y2="728" stroke="#111" stroke-width="2"/>
  <polygon points="268,740 261,728 275,728" fill="#111"/>

  <rect x="20" y="745" width="496" height="90" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="72" cy="790" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-drop" x="49" y="767" width="46" height="46" color="white"/>
  <text x="112" y="779" class="title">CHECK GLUCOSE AND TEMPERATURE</text>
  <text x="112" y="807" class="bodySmall">• Screen for low blood glucose and treat</text>
  <text x="112" y="828" class="bodySmall">• Check temperature and keep warm</text>

  <line x1="268" y1="835" x2="268" y2="868" stroke="#111" stroke-width="2"/>
  <polygon points="268,880 261,868 275,868" fill="#111"/>

  <rect x="20" y="885" width="496" height="95" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="72" cy="932" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-monitor" x="49" y="909" width="46" height="46" color="white"/>
  <text x="112" y="920" class="title">MONITOR</text>
  <text x="112" y="948" class="bodySmall">• Pre- and post-ductal oxygen saturation</text>
  <text x="112" y="969" class="bodySmall">• Heart rate, respirations and perfusion</text>
</g>

<!-- Algorithm 2 -->
<g class="font">
  <rect x="552" y="100" width="496" height="42" rx="6" fill="#FFFBEA" stroke="#D8D1A6"/>
  <text x="800" y="128" text-anchor="middle" class="step">STEP 3: CLINICAL ASSESSMENT</text>

  <rect x="552" y="158" width="496" height="170" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="604" cy="213" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-clipboard" x="581" y="190" width="46" height="46" color="white"/>
  <text x="652" y="187" class="title">HISTORY</text>
  <text x="652" y="216" class="bodySmall">• Review antenatal scan for anomalies</text>
  <text x="652" y="237" class="bodySmall">• Maternal conditions: diabetes, hypertension, infection</text>
  <text x="652" y="258" class="bodySmall">• Birth history and resuscitation details</text>
  <text x="652" y="279" class="bodySmall">• Maternal medication and infection risk</text>

  <rect x="552" y="342" width="496" height="200" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="604" cy="397" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-steth" x="581" y="374" width="46" height="46" color="white"/>
  <text x="652" y="371" class="title">EXAMINATION</text>
  <text x="652" y="400" class="bodySmall">• General: dysmorphic features, pallor, jaundice, oedema</text>
  <text x="652" y="421" class="bodySmall">• Perfusion: capillary refill time, pulses, blood pressure</text>
  <text x="652" y="442" class="bodySmall">• Cardiac: heart rate, rhythm, murmur</text>
  <text x="652" y="463" class="bodySmall">• Respiratory: work of breathing, air entry</text>
  <text x="652" y="484" class="bodySmall">• Neurological: tone, reflexes, seizures</text>

  <rect x="552" y="557" width="496" height="110" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="604" cy="612" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-ox" x="581" y="589" width="46" height="46" color="white"/>
  <text x="652" y="590" class="title">PULSE OXIMETRY SCREENING</text>
  <text x="652" y="619" class="bodySmall">• Measure oxygen saturation in right hand and either foot</text>
  <text x="652" y="641" class="bodySmall">• Record pre- and post-ductal difference</text>

  <line x1="800" y1="667" x2="800" y2="695" stroke="#111" stroke-width="2"/>
  <polygon points="800,707 793,695 807,695" fill="#111"/>

  <rect x="552" y="710" width="496" height="120" rx="8" fill="white" stroke="#D90000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="800" y="746" text-anchor="middle" class="redTitle">ABNORMAL IF:</text>
  <text x="800" y="780" text-anchor="middle" class="body">Oxygen saturation less than 95% in air</text>
  <text x="800" y="806" text-anchor="middle" class="body">OR</text>
  <text x="800" y="832" text-anchor="middle" class="body">Pre-ductal and post-ductal difference greater than 3%</text>

  <line x1="800" y1="830" x2="800" y2="866" stroke="#111" stroke-width="2"/>
  <polygon points="800,878 793,866 807,866" fill="#111"/>

  <rect x="552" y="885" width="496" height="42" rx="6" fill="#FFFBEA" stroke="#D8D1A6"/>
  <text x="800" y="913" text-anchor="middle" class="step">STEP 4: PERFORM HYPEROXIA TEST</text>

  <rect x="552" y="940" width="496" height="55" rx="6" fill="white" stroke="#AABAB4"/>
  <circle cx="604" cy="968" r="25" fill="url(#greenIcon)"/>
  <use href="#icon-lungs" x="585" y="949" width="38" height="38" color="white"/>
  <text x="652" y="965" class="bodySmall">Administer 100% oxygen for 10 minutes and reassess oxygen saturation.</text>
</g>

<!-- Algorithm 3 -->
<g class="font">
  <circle cx="1220" cy="125" r="31" fill="url(#redIcon)"/>
  <use href="#icon-heart" x="1197" y="102" width="46" height="46" color="white"/>
  <circle cx="1438" cy="125" r="31" fill="url(#greenIcon)"/>
  <use href="#icon-lungs" x="1415" y="102" width="46" height="46" color="white"/>

  <rect x="1084" y="168" width="240" height="250" rx="6" fill="white" stroke="#F04B4B"/>
  <text x="1204" y="198" text-anchor="middle" class="redTitle">CARDIAC CAUSE</text>
  <text x="1204" y="220" text-anchor="middle" class="redTitle">LIKELY IF:</text>
  <line x1="1084" y1="232" x2="1324" y2="232" stroke="#F04B4B"/>
  <text x="1102" y="265" class="bodySmall" fill="#D90000">• Cyanosis persists despite</text>
  <text x="1117" y="284" class="bodySmall">adequate oxygen</text>
  <text x="1102" y="313" class="bodySmall">• Weak or absent pulses or</text>
  <text x="1117" y="332" class="bodySmall">poor perfusion</text>
  <text x="1102" y="361" class="bodySmall">• Murmur</text>
  <text x="1102" y="390" class="bodySmall">• Dysmorphic features</text>
  <text x="1102" y="419" class="bodySmall">• Shock or metabolic acidosis</text>

  <rect x="1336" y="168" width="244" height="250" rx="6" fill="white" stroke="#7EA18E"/>
  <text x="1458" y="198" text-anchor="middle" class="greenTitle">NON-CARDIAC CAUSE</text>
  <text x="1458" y="220" text-anchor="middle" class="greenTitle">LIKELY IF:</text>
  <line x1="1336" y1="232" x2="1580" y2="232" stroke="#7EA18E"/>
  <text x="1354" y="265" class="bodySmall">• Oxygen saturation improves</text>
  <text x="1369" y="284" class="bodySmall">with oxygen</text>
  <text x="1354" y="313" class="bodySmall">• Signs of respiratory distress</text>
  <text x="1369" y="332" class="bodySmall">or lung disease</text>
  <text x="1354" y="361" class="bodySmall">• Normal cardiac examination</text>
  <text x="1354" y="390" class="bodySmall">• No differential cyanosis:</text>
  <text x="1369" y="409" class="bodySmall">pre-ductal and post-ductal</text>
  <text x="1369" y="428" class="bodySmall">difference less than 3%</text>

  <rect x="1084" y="432" width="240" height="310" rx="6" fill="white" stroke="#F04B4B"/>
  <rect x="1084" y="432" width="240" height="44" rx="6" fill="#D90000"/>
  <text x="1204" y="461" text-anchor="middle" class="boxhead">MANAGEMENT</text>

  <circle cx="1118" cy="512" r="22" fill="url(#redIcon)"/>
  <use href="#icon-phone" x="1102" y="496" width="32" height="32" color="white"/>
  <text x="1160" y="500" class="bodySmall">Urgently discuss with</text>
  <text x="1160" y="519" class="bodySmall">referral centre.</text>

  <circle cx="1118" cy="576" r="22" fill="url(#redIcon)"/>
  <use href="#icon-syringe" x="1102" y="560" width="32" height="32" color="white"/>
  <text x="1160" y="560" class="bodySmall">Consider prostaglandin E₁</text>
  <text x="1160" y="579" class="bodySmall">in discussion with</text>
  <text x="1160" y="598" class="bodySmall">referral centre.</text>

  <circle cx="1118" cy="650" r="22" fill="url(#redIcon)"/>
  <use href="#icon-drop" x="1102" y="634" width="32" height="32" color="white"/>
  <text x="1160" y="637" class="bodySmall">Obtain blood gas. Low</text>
  <text x="1160" y="656" class="bodySmall">oxygen tension is typical.</text>

  <circle cx="1118" cy="710" r="22" fill="url(#redIcon)"/>
  <use href="#icon-ambulance" x="1102" y="694" width="32" height="32" color="white"/>
  <text x="1160" y="696" class="bodySmall">Arrange urgent transfer</text>

<script>
function downloadPNG() {
  const svg = document.getElementById("poster");
  const clone = svg.cloneNode(true);

  clone.setAttribute("width", "1600");
  clone.setAttribute("height", "1067");
  clone.setAttribute("viewBox", "0 0 1600 1067");

  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(clone);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);

  const image = new Image();

  image.onload = function () {
    const scale = 5;
    const canvas = document.createElement("canvas");
    canvas.width = 1600 * scale;
    canvas.height = 1067 * scale;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

    URL.revokeObjectURL(url);

    canvas.toBlob(function (blob) {
      const link = document.createElement("a");
      link.download = "cyanosis-newborn-algorithm-8000px.png";
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }, "image/png");
  };

  image.onerror = function () {
    alert("PNG export failed in this browser. Please try Chrome.");
    URL.revokeObjectURL(url);
  };

  image.src = url;
}
</script>
